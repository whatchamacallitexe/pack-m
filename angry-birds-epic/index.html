<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/angry-bird/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Angry Birds Epic</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>body,html{margin:0;overflow:hidden;background:#000}</style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1" style="width:100vw;height:100vh;cursor:default"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
  </div>
  <script src="Build/EpicWeb.loader.js"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/EpicWeb.data",
      frameworkUrl: "Build/EpicWeb.framework.js",
      codeUrl: "Build/EpicWeb.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Rovio",
      productName: "Angry Birds Epic",
      productVersion: "1.0"
    });
  </script>
</body>
</html>
